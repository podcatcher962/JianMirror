{zh:{title:"第二十七回<br>尸魔三戏唐三藏 · 圣僧恨逐美猴王",orig:"白骨精三次变化——村姑、老妇、老翁——来骗唐僧。悟空火眼金睛，三次识破，三次抡棒打死。可唐僧肉眼凡胎，只见悟空「无故伤人」，又听八戒一旁拱火，念起紧箍咒，写下贬书，将悟空逐回花果山。悟空含泪叩别。",line:"有些委屈，不是打妖怪能解的。",dil:"你凭专业判断，看出当前方案有重大隐患，证据确凿。可领导肉眼看不见风险，同事还在旁边说「就你多事」。你会怎么做？",
 opts:[{a:"把证据甩到桌面上，据理力争，哪怕被记恨",b:"悟空型 · 专业优先，风险前置",who:"悟空型 · 锐",idx:106,du:"白骨精三戏三打，真话被当成了冒犯。不是妖怪打败了你，是身边的唐僧和八戒。你的火眼金睛，还信吗？<span class='s'>此难度与不度，都在你。——见素</span>"},
 {a:"按程序办事，领导定什么我执行什么",b:"唐僧型 · 程序正义，服从规则",who:"唐僧型 · 执",idx:98,du:"你守的是戒律和程序，不是真相。规则保护了你，也蒙住了你——火眼金睛与肉眼凡胎之间，隔着一个「敢不敢信自己」。<span class='s'>此难度与不度，都在你。——见素</span>"},
 {a:"点到为止，不再多说，先把自己摘干净",b:"八戒型 · 沉默自保，明哲保身",who:"八戒型 · 滑",idx:91,du:"你学会了看眼色，学会了沉默。那一棒你没打下去，妖怪也没走远——你只是学会了在取经路上，先管好自己的耳朵。<span class='s'>此难度与不度，都在你。——见素</span>"}]},
en:{title:"Chapter 27<br>The Corpse Demon Tricks the Monk Thrice; The Sage Monk Banishes the Monkey King",orig:"The Bone Demon disguises herself thrice — a girl, an old woman, an old man. Wukong sees through each and strikes her down. But Tang Monk, seeing only senseless killing and urged on by Bajie, recites the tightening spell and banishes Wukong.",line:"Some wrongs cannot be undone by slaying monsters.",dil:"You see a major flaw in the current plan with solid evidence, but your boss cannot see it and a colleague says you are making trouble. What do you do?",
 opts:[{a:"Throw the evidence on the table and fight for it, even if resented",b:"Wukong · truth first",who:"Wukong · Sharp",idx:106,du:"Truth became an offense. It was not the demon that defeated you — it was the Tang Monk and Bajie beside you. Do you still trust your flaming eyes?<span class='s'>This trial is yours to take or leave. — JianMirror</span>"},
 {a:"Follow procedure and comply with whatever the boss decides",b:"Tang Monk · process over truth",who:"Tang Monk · Rigid",idx:98,du:"You keep the rules, not the truth. Rules shield you, and blind you — between fiery eyes and mortal eyes lies one question: dare you trust yourself?<span class='s'>This trial is yours to take or leave. — JianMirror</span>"},
 {a:"Say just enough, say no more, keep yourself clean",b:"Bajie · stay silent, stay safe",who:"Bajie · Smooth",idx:91,du:"You learned to read the room, to stay quiet. That strike never landed, and the demon never left — you only learned to guard your ears.<span class='s'>This trial is yours to take or leave. — JianMirror</span>"}]}},
{zh:{title:"第五十八回<br>二心搅乱大乾坤 · 一体难修真寂灭",orig:"六耳猕猴变作悟空模样，打伤唐僧，抢走行李。真假悟空打到如来面前，如来辨出六耳，悟空一棒打死。此后，悟空不再硬刚，先查妖怪后台，也不再提回花果山——他到底是成长了，还是被「置换」了？",line:"死的是六耳，还是原来的悟空？",dil:"你在大厂/体制里待了几年，发现那个「以前敢拍桌子、敢说真话的自己」不见了。朋友说你成熟了，你心里却空落落的。这是成长，还是被换掉了？",
 opts:[{a:"成熟不等于认输，我在工作里守规则，心里还留着那片花果山",b:"悟空型 · 外圆内方",who:"悟空型 · 锐",idx:104,du:"这一棒打死的到底是六耳，还是原来的你？斗战胜佛是被规训成功的标本——你的野性还留几成，只有你自己知道。<span class='s'>此难度与不度，都在你。——见素</span>"},
 {a:"我确实变了，但安稳比锋利重要，这没什么不好",b:"唐僧型 · 随缘安分",who:"唐僧型 · 执",idx:94,du:"你选择了安稳，把锋利的自己收进了盒子里。盒子里没有风浪，也没有花果山——偶尔路过镜子，别忘了看一眼里面是谁。<span class='s'>此难度与不度，都在你。——见素</span>"},
 {a:"说不清哪个是真的我，好像两边都是我",b:"八戒型 · 模棱两可",who:"八戒型 · 滑",idx:98,du:"真我和假我，你早已分不清，也不愿分清。混沌有时是智慧，有时是逃避——但镜子里照出的，始终只有一个人。<span class='s'>此难度与不度，都在你。——见素</span>"}]},
en:{title:"Chapter 58<br>Two Hearts Throw Heaven into Turmoil; One Body Is Hard Put to Cultivate the Void",orig:"A six-eared macaque takes Wukong's form, injures Tang Monk, and steals the luggage. The two Wukongs fight to the Buddha, who exposes the impostor; Wukong kills it. From then on, Wukong no longer fights head-on and never mentions returning home — has he grown, or has he been replaced?",line:"Who died — the impostor, or the original Wukong?",dil:"After years in the corporate machine, the person who used to speak up is gone. Friends call it maturity; you feel an emptiness. Growth, or replacement?",
 opts:[{a:"Maturity is not surrender — I keep the rules at work, and keep my mountain in my heart",b:"Wukong · smooth outside, true inside",who:"Wukong · Sharp",idx:104,du:"What died that day — the impostor, or you? The victorious Buddha is a well-trained specimen. Only you know how much wildness remains.<span class='s'>This trial is yours to take or leave. — JianMirror</span>"},
 {a:"I have changed, and safety matters more than sharpness — that is fine",b:"Tang Monk · serene compliance",who:"Tang Monk · Rigid",idx:94,du:"You chose safety and shelved your sharp self. The box keeps out storms, and also your mountain — pass a mirror once in a while.<span class='s'>This trial is yours to take or leave. — JianMirror</span>"},
 {a:"I cannot tell which is the real me — both sides feel like me",b:"Bajie · neither here nor there",who:"Bajie · Smooth",idx:98,du:"True and false have blurred, and you no longer care to tell. Ambiguity is sometimes wisdom, sometimes escape — but the mirror always shows one person.<span class='s'>This trial is yours to take or leave. — JianMirror</span>"}]}},
{zh:{title:"第十四回 · 心猿归正 六贼无踪<br>（金箍始末）",orig:"观音给悟空戴上金箍，传了唐僧紧箍咒。不听话，就念咒，头疼欲裂。可成佛那日，金箍自己消失了——它从来不是为「修心」，是为「听话」。",line:"你不是自由了箍才掉，是没用了才掉。",dil:"你身上有没有一道「紧箍咒」——房贷、绩效、职级、家人的期待？它护着你安稳，也管着你听话。你怎么看它？",
 opts:[{a:"我接受这道箍：它让我安稳，也让我按规矩做事",b:"唐僧型 · 顺受",who:"唐僧型 · 执",idx:95,du:"箍护你周全，也替你做了决定。安稳是要付代价的，代价是那句「我想」越说越少——但日子，确实好过。<span class='s'>此难度与不度，都在你。——见素</span>"},
 {a:"我会在箍里腾挪：表面听话，心里留一块自己的地",b:"八戒型 · 明哲",who:"八戒型 · 滑",idx:100,du:"你戴着箍，却学会了在箍里打转：领导面前低眉，心里自有山海。这不是滑头，是普通人的生存智慧。<span class='s'>此难度与不度，都在你。——见素</span>"},
 {a:"我在攒本事、攒底气，想有一天把这箍摘了",b:"悟空型 · 破局",who:"悟空型 · 锐",idx:108,du:"你信箍是暂时的。攒的本事、存的底气，都是为了那一天的「摘」——但别忘了，摘箍之前，先看清自己的头在哪。<span class='s'>此难度与不度，都在你。——见素</span>"}]},
en:{title:"Chapter 14 · The Heart-Ape Returns to the Right<br>(the story of the band)",orig:"Guanyin puts a golden band on Wukong's head and teaches Tang Monk the Tightening Spell. Disobey, and the spell brings agonizing pain. Yet on the day he becomes a Buddha, the band falls away on its own — it was never for cultivating the mind, but for obedience.",line:"The band falls not when you are free, but when you are no longer needed.",dil:"Is there a band on your head — mortgage, KPIs, rank, family expectations? It keeps you safe, and it keeps you obedient. How do you see it?",
 opts:[{a:"I accept the band: it keeps me safe and keeps me in line",b:"Tang Monk · acceptance",who:"Tang Monk · Rigid",idx:95,du:"The band protects you and decides for you. Safety has a price: the phrase 'I want' grows quieter — but life, indeed, is easier.<span class='s'>This trial is yours to take or leave. — JianMirror</span>"},
 {a:"I maneuver within the band: obedient outside, my own land inside",b:"Bajie · discretion",who:"Bajie · Smooth",idx:100,du:"You wear the band but learned to spin within it: low head to the boss, mountains in the heart. Not slyness — a commoner's wisdom.<span class='s'>This trial is yours to take or leave. — JianMirror</span>"},
 {a:"I am saving skill and spine, hoping one day to take the band off",b:"Wukong · breaker",who:"Wukong · Sharp",idx:108,du:"You believe the band is temporary. Every skill saved, every spine kept, is for that day of removal — but first, know where your head stands.<span class='s'>This trial is yours to take or leave. — JianMirror</span>"}]}},
{zh:{title:"第四回 · 官封弼马心何足 · 名注齐天意未宁",orig:"悟空上天，被封「弼马温」——听着是「御马监正堂管事」，实则是末等养马小官。他怒反天庭，回花果山，挂起「齐天大圣」的旗。",line:"你愤怒的不是官小，是被当傻子。",dil:"你接到一个 title 很响的 offer，进去才发现活是打杂的，title 只是安抚。你会怎么做？",
 opts:[{a:"掀桌子不干，宁可回「花果山」做自己",b:"悟空型 · 掀桌",who:"悟空型 · 锐",idx:109,du:"你掀了桌子，为自己挂起那面旗。代价是路难走些，好处是抬头时，天还是那片天。<span class='s'>此难度与不度，都在你。——见素</span>"},
 {a:"先干着，title 好用就行，骑驴找马",b:"八戒型 · 骑驴",who:"八戒型 · 滑",idx:97,du:"你把 title 当梯子，把忍耐当本钱。聪明，但也别忘了梯子顶端，还站着谁。<span class='s'>此难度与不度，都在你。——见素</span>"},
 {a:"反思是不是自己心气太高，踏踏实实从头做起",b:"唐僧型 · 守戒",who:"唐僧型 · 执",idx:92,du:"你选择了踏实，把「齐天」藏进「弼马」的皮囊里。稳妥是稳妥，只是那面旗，还挂不挂得起来。<span class='s'>此难度与不度，都在你。——见素</span>"}]},
en:{title:"Chapter 4 · The Title of Horsekeeper Rankles; The Name of Great Sage Leaves No Peace",orig:"Wukong is given the title 'Keeper of the Heavenly Horses' — it sounds grand, but it is the lowest stable job. Furious, he leaves Heaven and raises his own banner: 'Great Sage, Equal of Heaven.'",line:"You rage not at the small post, but at being treated like a fool.",dil:"You take a job with a grand title, then find the work is grunt work — the title was just a placate. What do you do?",
 opts:[{a:"Walk out and go back to my own mountain",b:"Wukong · defiance",who:"Wukong · Sharp",idx:109,du:"You turned the table and raised your own banner. The road is harder; the reward is that when you look up, the sky is still the sky.<span class='s'>This trial is yours to take or leave. — JianMirror</span>"},
 {a:"Keep the job, use the title as a ladder, and look around",b:"Bajie · ladder",who:"Bajie · Smooth",idx:97,du:"You treat the title as a ladder and patience as capital. Clever — but remember who stands at the top of the ladder.<span class='s'>This trial is yours to take or leave. — JianMirror</span>"},
 {a:"Reflect that I may be too proud, and start humbly from the bottom",b:"Tang Monk · discipline",who:"Tang Monk · Rigid",idx:92,du:"You chose steadiness, tucking 'Equal of Heaven' into the stablekeeper's skin. Safe, yes — but can that banner still be raised?<span class='s'>This trial is yours to take or leave. — JianMirror</span>"}]}},
{zh:{title:"第五十四回<br>法性西来逢女国 · 心猿定计脱姻缘",orig:"西梁女国，女王对唐僧一见倾心，愿以江山为聘、招他为王。唐僧凡心微动，却假意应承，骗得通关文牒后脱身西行。九九八十一难里，唯有这一难，没有妖怪。",line:"这一难没有妖怪，只有你自己。",dil:"一个真心待你、能给你安稳和温柔的人或机会摆在眼前，而你心里还装着一条没走完的路（理想、事业、未竟的心愿）。留下，还是继续走？",
 opts:[{a:"留下。温柔乡也是归宿，取经路太苦，我认了",b:"八戒型 · 安于烟火",who:"八戒型 · 滑",idx:88,du:"你选了人间烟火，放下那条未必有终点的路。没有对错，只有取舍——只是往后别在安稳里，偶尔梦见那条没走完的路。<span class='s'>此难度与不度，都在你。——见素</span>"},
 {a:"继续走。心里的经不取完，不甘心",b:"唐僧型 · 志向不改",who:"唐僧型 · 执",idx:96,du:"你守住了志向，用一场假意换来了放行。最难的不是妖怪，是那份「差点就留下」的动摇——你赢了路，也输给过自己一次。<span class='s'>此难度与不度，都在你。——见素</span>"},
 {a:"我不知道。两边都放不下，边走边看",b:"沙僧型 · 踌躇",who:"沙僧型 · 稳",idx:90,du:"你在温柔乡与取经路之间摇摆，迟迟不敢落子。犹豫不是错，停在原地太久才是——路会老，人也会。<span class='s'>此难度与不度，都在你。——见素</span>"}]},
en:{title:"Chapter 54<br>Reaching the Women's Kingdom; The Ape Escapes by a Ruse",orig:"In the Women's Kingdom, the queen falls for Tang Monk and offers her throne. His heart wavers, yet he feigns consent, secures the travel permit, and slips away. Among all 81 trials, this is the only one with no demon.",line:"This trial has no demon — only yourself.",dil:"Someone (or something) offers you warmth, safety and a good life, yet a road you have not finished (an ideal, a career, an unfulfilled wish) still tugs at you. Stay, or keep walking?",
 opts:[{a:"Stay. A gentle home is a destination too; the road is too hard",b:"Bajie · settle for warmth",who:"Bajie · Smooth",idx:88,du:"You chose human warmth and set down a road that may have no end. No right or wrong, only a trade — just don't dream of that unfinished road in your ease.<span class='s'>This trial is yours to take or leave. — JianMirror</span>"},
 {a:"Keep walking. I will not rest until the scripture in my heart is complete",b:"Tang Monk · steady aim",who:"Tang Monk · Rigid",idx:96,du:"You held your aim, buying passage with a ruse. The hardest trial was no demon but the near-surrender — you won the road, and lost to yourself once.<span class='s'>This trial is yours to take or leave. — JianMirror</span>"},
 {a:"I don't know. I cannot let go of either; I will walk and see",b:"Sha Monk · wavering",who:"Sha Monk · Steady",idx:90,du:"You sway between warmth and road, afraid to commit. Hesitation is not wrong — staying frozen too long is. Roads age; so do people.<span class='s'>This trial is yours to take or leave. — JianMirror</span>"}]}},
{zh:{title:"第五十九回<br>路阻火焰山 · 一调芭蕉扇",orig:"火焰山烈焰挡路，唯有铁扇公主的芭蕉扇能灭。悟空去借，铁扇公主记着红孩儿之仇，一扇把他扇飞；悟空变作小虫钻进她腹中折腾，借到的却是把假扇，火越扇越旺。",line:"办正事，有时最难的不是事，是挡在事前面的人。",dil:"一件非办不可的正事，卡在一个跟你有旧怨、又有资源的人手里，对方故意刁难。你怎么过这道关？",
 opts:[{a:"正面硬刚，讲道理讲不通就斗到底",b:"悟空型 · 硬碰",who:"悟空型 · 锐",idx:104,du:"你选择正面迎上去，管它是旧怨还是刁难。硬刚能破局，也会结新仇——但有些关，不硬就过不去。<span class='s'>此难度与不度，都在你。——见素</span>"},
 {a:"走关系疏通，找能说上话的人递个话",b:"八戒型 · 借力",who:"八戒型 · 滑",idx:93,du:"你懂得借力，把难题交给能说上话的人。聪明，也省力——只是借来的路，终究要还人情。<span class='s'>此难度与不度，都在你。——见素</span>"},
 {a:"不撕破脸，曲线迂回，换个法子智取",b:"沙僧型 · 迂回",who:"沙僧型 · 稳",idx:98,du:"你不硬不软，绕着走，用巧劲把事办成。这是成年人的周全——稳，是另一种锋利。<span class='s'>此难度与不度，都在你。——见素</span>"}]},
en:{title:"Chapter 59<br>The Flaming Mountain Blocks the Way; The First Borrowing of the Palm-Leaf Fan",orig:"A mountain of flames blocks the road; only Princess Iron Fan's palm-leaf fan can put it out. Wukong asks to borrow it, but she remembers her grudge over the Red Boy and fans him away. He turns into an insect and torments her, only to get a fake fan that makes the fire worse.",line:"The hardest part of a job is often not the work, but the person blocking it.",dil:"An essential task is stuck in the hands of someone who holds a grudge against you and controls the resource. They make it hard on purpose. How do you get through?",
 opts:[{a:"Fight head-on; if reason fails, I will battle to the end",b:"Wukong · direct",who:"Wukong · Sharp",idx:104,du:"You face it directly, grudges and all. Head-on force breaks the lock but may bind new knots — yet some gates never open without it.<span class='s'>This trial is yours to take or leave. — JianMirror</span>"},
 {a:"Go through connections; find someone with influence to put in a word",b:"Bajie · leverage",who:"Bajie · Smooth",idx:93,du:"You borrow force, handing the knot to someone who can speak. Clever and cheap — but a borrowed road must be repaid in favors.<span class='s'>This trial is yours to take or leave. — JianMirror</span>"},
 {a:"Don't tear the face; take a winding path and outsmart it",b:"Sha Monk · detour",who:"Sha Monk · Steady",idx:98,du:"Neither hard nor soft, you go around and get it done with finesse. That is grown-up composure — steadiness is another kind of edge.<span class='s'>This trial is yours to take or leave. — JianMirror</span>"}]}},
{zh:{title:"第四十四回<br>车迟国斗法 · 外来的和尚",orig:"车迟国国王宠信虎力、鹿力、羊力三位国师（实为妖道），满国和尚被奴役服苦役。悟空救下众僧，与三妖斗法——求雨、坐禅、隔板猜物、砍头——赢了斗法，也还了和尚公道。",line:"有真本事的人，不该被地头蛇压着。",dil:"你带着本事空降到一个新环境，发现是「地头蛇」说了算，你的专业不被认可，甚至被排挤。你怎么立住脚？",
 opts:[{a:"用真本事硬碰，一场一场证明自己",b:"悟空型 · 立威",who:"悟空型 · 锐",idx:105,du:"你把本事摆上台面，一场一场赢回来。真金不怕火炼——但也要留神，赢了斗法，未必赢得人心。<span class='s'>此难度与不度，都在你。——见素</span>"},
 {a:"先融入再徐图，摸清规矩慢慢来",b:"沙僧型 · 蓄力",who:"沙僧型 · 稳",idx:96,du:"你先蹲下来看清水深，再一步步往上走。稳，不容易出错，也不容易出头——时候到了，自有你的场子。<span class='s'>此难度与不度，都在你。——见素</span>"},
 {a:"拉拢关键人，站到能保护自己的那边去",b:"八戒型 · 站队",who:"八戒型 · 滑",idx:91,du:"你懂得找靠山，站在能护你的一方。识时务是本事，只是别在站队里，把自己站丢了。<span class='s'>此难度与不度，都在你。——见素</span>"}]},
en:{title:"Chapter 44<br>Contest of Magic at the Cart-Slow Kingdom; The Outsider Monk",orig:"The king favors three demon priests and enslaves every monk in the land. Wukong frees them and challenges the demons to a contest — rain-making, meditation, divination, beheading — wins each, and restores justice to the monks.",line:"A person with real skill should not be pinned under a local bully.",dil:"You arrive in a new place with real skills, only to find the local power-holders call the shots — your expertise is dismissed, even pushed out. How do you stand your ground?",
 opts:[{a:"Prove myself match by match with real skill",b:"Wukong · establish",who:"Wukong · Sharp",idx:105,du:"You put your skill on the table and win it back round by round. Real gold fears no fire — but remember, winning the contest is not always winning the room.<span class='s'>This trial is yours to take or leave. — JianMirror</span>"},
 {a:"Fit in first, read the rules, and build up slowly",b:"Sha Monk · gather",who:"Sha Monk · Steady",idx:96,du:"You squat low to read the water before climbing up. Steady rarely errs, and rarely leaps ahead — when the time comes, the stage is yours.<span class='s'>This trial is yours to take or leave. — JianMirror</span>"},
 {a:"Win over the key people and stand with the side that protects me",b:"Bajie · side-taking",who:"Bajie · Smooth",idx:91,du:"You find a patron and stand where you are shielded. Reading the room is a skill — just don't lose yourself while choosing sides.<span class='s'>This trial is yours to take or leave. — JianMirror</span>"}]}},
{zh:{title:"第二十四回<br>五庄观窃人参 · 一怒闯祸",orig:"五庄观有棵人参果树，三千年一结果。悟空受八戒怂恿偷了人参果，被两个童子一顿辱骂，他一怒之下推倒整棵树，闯下弥天大祸，最后四处求人，才请来观音救活果树。",line:"一句气话，推倒的可能是整棵树。",dil:"年轻气盛时，你因为一句气话、一时冲动，闯了一个自己收拾不了的大祸。回头看，你会怎么处理？",
 opts:[{a:"硬扛到底，自己闯的祸自己收拾",b:"悟空型 · 担责",who:"悟空型 · 锐",idx:100,du:"你选择自己扛，四处求人也要把事平了。担当是硬汉子的底色——但那一怒，本该在推树之前收住。<span class='s'>此难度与不度，都在你。——见素</span>"},
 {a:"立刻认怂，放下身段找能帮忙的人",b:"沙僧型 · 务实",who:"沙僧型 · 稳",idx:97,du:"你懂得在闯祸后第一时间低头找外援，把损失降到最小。务实不丢人，丢人的是把面子看得比树还重。<span class='s'>此难度与不度，都在你。——见素</span>"},
 {a:"能躲就躲，等风头过去再说",b:"八戒型 · 回避",who:"八戒型 · 滑",idx:86,du:"你选择先躲一躲，等风声过去。躲得了一时，躲不了一世——树倒了，总要有人来扶。<span class='s'>此难度与不度，都在你。——见素</span>"}]},
en:{title:"Chapter 24<br>Stealing the Ginseng Fruit at Five-Village Temple; One Angry Catastrophe",orig:"The temple keeps a ginseng-fruit tree that bears once in three thousand years. Goaded by Bajie, Wukong steals the fruit; enraged by the servants' insults, he topples the entire tree. Only after begging far and wide does he bring Guanyin to revive it.",line:"One angry word can topple a whole tree.",dil:"In your hot-headed youth, a single angry word or impulse made a mess you could not clean up. Looking back, how would you handle it?",
 opts:[{a:"Bear it to the end; clean up my own mess",b:"Wukong · own it",who:"Wukong · Sharp",idx:100,du:"You carry it yourself, begging far and wide to set it right. Responsibility is the core of a hard man — but that rage should have stopped before the tree fell.<span class='s'>This trial is yours to take or leave. — JianMirror</span>"},
 {a:"Lower my head at once and find someone who can help",b:"Sha Monk · practical",who:"Sha Monk · Steady",idx:97,du:"You bow and seek help the moment the mess happens, cutting the loss to a minimum. Pragmatism is no shame — the shame is prizing face over the tree.<span class='s'>This trial is yours to take or leave. — JianMirror</span>"},
 {a:"Hide if I can, and wait for the storm to pass",b:"Bajie · avoid",who:"Bajie · Smooth",idx:86,du:"You duck away and wait for the noise to die. You can hide for a while, not forever — a fallen tree always waits for someone to lift it.<span class='s'>This trial is yours to take or leave. — JianMirror</span>"}]}},
{zh:{title:"第七十八回<br>比丘国救子 · 剖腹为证",orig:"比丘国国王听信妖道，要取一千一百一十一个小儿心肝做药引。悟空救下众小儿，又变作唐僧，在朝堂上剖开肚腹、掏出一堆心肝（实为变化），逼得妖道现出原形。",line:"有些事不关你，但你看见了，就绕不过去。",dil:"一件明知道该做、却代价极大、而且本不关你的事摆在眼前。你会不会出头？",
 opts:[{a:"出头扛下来，看见了就不能当没看见",b:"悟空型 · 侠义",who:"悟空型 · 锐",idx:107,du:"你选择站出来，哪怕剖腹为证。侠义不是不疼，是疼也认——这世间有些公道，就靠几个不肯闭眼的人撑着。<span class='s'>此难度与不度，都在你。——见素</span>"},
 {a:"先观望，看看有没有别人先出头",b:"八戒型 · 观望",who:"八戒型 · 滑",idx:88,du:"你先看看风头，等别人先动。观望是自保，也是把良心的火苗按了按——只是等你再看时，场子可能已经凉了。<span class='s'>此难度与不度，都在你。——见素</span>"},
 {a:"绕开，那是别人的因果，不关我的事",b:"沙僧型 · 明哲",who:"沙僧型 · 稳",idx:82,du:"你选择绕开，把因果还给了别人。明哲保身没有错，只是往后夜里，那双眼别总在梦里看着你。<span class='s'>此难度与不度，都在你。——见素</span>"}]},
en:{title:"Chapter 78<br>Saving the Children at Bhiksu; Disembowelment as Proof",orig:"Deceived by a demon priest, the king plans to use the hearts of 1,111 children as medicine. Wukong saves the children, then, disguised as Tang Monk, cuts open his belly and pulls out a heap of organs (all illusion), forcing the demon to reveal itself.",line:"Some things are none of your business — but once you have seen them, you cannot walk past.",dil:"A deed you know is right stands before you, at great cost, and it was never your affair. Do you step up?",
 opts:[{a:"Step up and bear it; having seen it, I cannot unsee it",b:"Wukong · righteous",who:"Wukong · Sharp",idx:107,du:"You step forward, even to the point of proof by disembowelment. Righteousness is not painless — it is pain accepted. Some justice rests on the few who refuse to close their eyes.<span class='s'>This trial is yours to take or leave. — JianMirror</span>"},
 {a:"Wait and watch; see if anyone else moves first",b:"Bajie · onlooker",who:"Bajie · Smooth",idx:88,du:"You wait for the wind, for someone else to move first. Watching is self-protection — and a way of pressing down the small flame of conscience. Look again, and the room may have gone cold.<span class='s'>This trial is yours to take or leave. — JianMirror</span>"},
 {a:"Step aside; it is another's karma, not mine",b:"Sha Monk · prudent",who:"Sha Monk · Steady",idx:82,du:"You step aside and return the karma to its owner. Prudence is no fault — just don't let those eyes keep watching you in your dreams.<span class='s'>This trial is yours to take or leave. — JianMirror</span>"}]}},
{zh:{title:"第九十九回<br>通天河湿经 · 最后一难",orig:"取经功成，东归过通天河。老鼋驮他们过河，问起当年托唐僧问如来寿数之事，唐僧早忘了。老鼋一怒，把经书掀进水里。经书湿透，摊在石上晾晒——九九八十一难，至此才圆满。",line:"你欠下的那句问话，会在最要紧的渡口，把你掀翻。",dil:"你辛苦做完一件事，却在最后一步，因为一个没兑现的小承诺翻了车。功亏一篑的那一刻，你怎么看？",
 opts:[{a:"自责懊悔，怎么就忘了那一句承诺",b:"唐僧型 · 执着圆满",who:"唐僧型 · 执",idx:90,du:"你盯着那个不圆满的收尾，久久放不下。经书湿了，晒干还是经书——只是你偏要它滴水不沾。<span class='s'>此难度与不度，都在你。——见素</span>"},
 {a:"功亏一篑，认了，但不甘心，下次记住",b:"沙僧型 · 复盘",who:"沙僧型 · 稳",idx:96,du:"你认下这个遗憾，也记住了那个渡口。不圆满才是常态——记住它，下次别再欠下那句问话。<span class='s'>此难度与不度，都在你。——见素</span>"},
 {a:"看淡。经书湿了晒干还是经书，翻车也是经历",b:"悟空型 · 豁达",who:"悟空型 · 锐",idx:102,du:"你一笑而过，把翻车看成了取经的一部分。豁达不是不在乎，是知道：湿过的经，反而更重。<span class='s'>此难度与不度，都在你。——见素</span>"}]},
en:{title:"Chapter 99<br>The Scriptures Drenched at the Flowing-Sand River; The Last Trial",orig:"The scriptures won, the pilgrims cross the river on an old turtle's back. It asks whether Tang Monk relayed its question to the Buddha; he forgot. Enraged, the turtle tips them and the scriptures into the water, to be dried on the rocks. Only then are the 81 trials complete.",line:"The question you failed to deliver will overturn you at the very ferry that matters most.",dil:"You finished a hard task, only to slip at the final step over one small, unkept promise. In that moment of near-miss, how do you see it?",
 opts:[{a:"Blame myself; how could I forget that one promise",b:"Tang Monk · crave completeness",who:"Tang Monk · Rigid",idx:90,du:"You fixate on that imperfect ending and cannot let go. Dried scriptures are still scriptures — yet you insist they stay perfectly dry.<span class='s'>This trial is yours to take or leave. — JianMirror</span>"},
 {a:"Accept the near-miss, but not happily; remember it for next time",b:"Sha Monk · review",who:"Sha Monk · Steady",idx:96,du:"You accept the regret and remember the ferry. Imperfection is the norm — remember it, and never leave that question undelivered again.<span class='s'>This trial is yours to take or leave. — JianMirror</span>"},
 {a:"Let it go. Dried scriptures are still scriptures; a fall is also part of the road",b:"Wukong · equanimity",who:"Wukong · Sharp",idx:102,du:"You smile and count the fall as part of the journey. Equanimity is not indifference — it is knowing that scriptures soaked weigh heavier.<span class='s'>This trial is yours to take or leave. — JianMirror</span>"}]}},
];

// ============ 渲染 ============
function renderMirror(){
  const m=MIRRORS[mi][lang];
  document.getElementById('sub').textContent = (lang==='zh'?'西游镜鉴录 · 第':'Xiyou Mirror Records · Mirror ')+(mi+1)+(lang==='zh'?'镜':'');
  document.getElementById('tOrgTitle').innerHTML=m.title;
  document.getElementById('tOrgP').textContent=m.orig;
  document.getElementById('tOrgQ').textContent=m.line;
  document.getElementById('tDilP').textContent=m.dil;
  for(let i=0;i<3;i++){
    document.getElementById('tOpt'+['A','B','C'][i]).textContent=m.opts[i].a;
    document.getElementById('tOpt'+['A','B','C'][i]+'2').textContent=m.opts[i].b;
  }
}
function enterMirror(){ renderMirror(); show('vOrigin'); }
function nextMirror(){ mi=(mi+1)%MIRRORS.length; renderMirror(); show('vOrigin'); }
function pick(i){
  const o=MIRRORS[mi][lang].opts[i], idx=Math.min(100,Math.max(0,o.idx));
  document.getElementById('tRes1').innerHTML = t('res1')+' <b>'+o.a+'</b>';
  document.getElementById('tRes2').innerHTML = t('res2')+' <b>'+o.who+'</b>';
  document.getElementById('rIdx').textContent=idx;
  document.getElementById('rDuyu').innerHTML=o.du;
  show('vResult');
  setTimeout(()=>{ document.getElementById('rFill').style.width=idx+'%'; document.getElementById('rFillLbl').textContent=idx; },120);
}
function setL(l){
  lang=l;
  document.getElementById('btnZh').className=l==='zh'?'active':'';
  document.getElementById('btnEn').className=l==='en'?'active':'';
  document.getElementById('tSound').textContent=t('sound');
  document.getElementById('tUse').textContent=t('use');
  document.getElementById('tDisc').textContent=t('disc');
  document.getElementById('tAbout').textContent=t('about');
  document.getElementById('slogan').textContent=t('slogan');
  document.getElementById('tHomeTag').textContent=t('homeTag');
  document.getElementById('tHomeP').textContent=t('homeP');
  document.getElementById('tHomeP2').textContent=t('homeP2');
  document.getElementById('tEnter').textContent=t('enter');
  document.getElementById('tOrgTag').textContent=t('orgTag');
  document.getElementById('tNext').textContent=t('next');
  document.getElementById('tDilTag').textContent=t('dilTag');
  document.getElementById('tDilTitle').textContent=t('dilTitle');
  document.getElementById('tResTag').textContent=t('resTag');
  document.getElementById('tIdxLbl').textContent=t('idxLbl');
  document.getElementById('tIdxTip').textContent=t('idxTip');
  document.getElementById('tNextM').textContent=t('nextM');
  renderMirror();
}
function openModal(type){
  const html = type==='use'?t('useHtml') : type==='disc'?t('discHtml') : t('aboutHtml');
  document.getElementById('modalBox').innerHTML = '<button class="modal-close" onclick="closeModal()">✕</button>' + html;
  document.getElementById('modalOverlay').classList.add('show');
}
function closeModal(){ document.getElementById('modalOverlay').classList.remove('show'); }
(function(){ try{applyTheme(localStorage.getItem('jsTheme')||'light');}catch(e){applyTheme('light');} setL('zh'); })();
</script>
