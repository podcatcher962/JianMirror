{zh:{title:"第二十七回<br>尸魔三戏唐三藏 · 圣僧恨逐美猴王",orig:"白骨精三次变化——村姑、老妇、老翁——来骗唐僧。悟空火眼金睛，三次识破，三次抡棒打死。可唐僧肉眼凡胎，只见悟空「无故伤人」，又听八戒一旁拱火，念起紧箍咒，写下贬书，将悟空逐回花果山。悟空含泪叩别。",line:"有些委屈，不是打妖怪能解的。",dil:"你凭专业判断，看出当前方案有重大隐患，证据确凿。可领导肉眼看不见风险，同事还在旁边说「就你多事」。你会怎么做？",
 opts:[{a:"把证据甩到桌面上，据理力争，哪怕被记恨",b:"悟空型 · 专业优先，风险前置",who:"悟空型 · 锐",idx:106,du:"白骨精三戏三打，真话被当成了冒犯。不是妖怪打败了你，是身边的唐僧和八戒。你的火眼金睛，还信吗？<span class='s'>此难度与不度，都在你。——见素</span>"},
 {a:"按程序办事，领导定什么我执行什么",b:"唐僧型 · 程序正义，服从规则",who:"唐僧型 · 执",idx:98,du:"你守的是戒律和程序，不是真相。规则保护了你，也蒙住了你——火眼金睛与肉眼凡胎之间，隔着一个「敢不敢信自己」。<span class='s'>此难度与不度，都在你。——见素</span>"},
 {a:"点到为止，不再多说，先把自己摘干净",b:"八戒型 · 沉默自保，明哲保身",who:"八戒型 · 滑",idx:91,du:"你学会了看眼色，学会了沉默。那一棒你没打下去，妖怪也没走远——你只是学会了在取经路上，先管好自己的耳朵。<span class='s'>此难度与不度，都在你。——见素</span>"}]},
en:{title:"Chapter 27<br>The Corpse Demon Tricks the Monk Thrice; The Sage Monk Banishes the Monkey King",orig:"The Bone Demon disguises herself thrice — a girl, an old woman, an old man. Wukong sees through each and strikes her down. But Tang Monk, seeing only senseless killing and urged on by Bajie, recites the tightening spell and banishes Wukong.",line:"Some wrongs cannot be undone by slaying monsters.",dil:"You see a major flaw in the current plan with solid evidence, but your boss cannot see it and a colleague says you are making trouble. What do you do?",
 opts:[{a:"Throw the evidence on the table and fight for it, even if resented",b:"Wukong · truth first",who:"Wukong · Sharp",idx:106,du:"Truth became an offense. It was not the demon that defeated you — it was the Tang Monk and Bajie beside you. Do you still trust your flaming eyes?<span class='s'>This trial is yours to take or leave. — JianMirror</span>"},
 {a:"Follow procedure and comply with whatever the boss decides",b:"Tang Monk · process over truth",who:"Tang Monk · Rigid",idx:98,du:"You keep the rules, not the truth. Rules shield you, and blind you — between fiery eyes and mortal eyes lies one question: dare you trust yourself?<span class='s'>This trial is yours to take or leave. — JianMirror</span>"},
 {a:"Say just enough, say no more, keep yourself clean",b:"Bajie · stay silent, stay safe",who:"Bajie · Smooth",idx:91,du:"You learned to read the room, to stay quiet. That strike never landed, and the demon never left — you only learned to guard your ears.<span class='s'>This trial is yours to take or leave. — JianMirror</span>"}]}},
{zh:{title:"第五十八回<br>二心搅乱大乾坤 · 一体难修真寂灭",orig:"六耳猕猴变作悟空模样，打伤唐僧，抢走行李。真假悟空打到如来面前，如来辨出六耳，悟空一棒打死。此后，悟空不再硬刚，先查妖怪后台，也不再提回花果山——他到底是成长了，还是被「置换」了？",line:"死的是六耳，还是原来的悟空？",dil:"你在大厂/体制里待了几年，发现那个「以前敢拍桌子、敢说真话的自己」不见了。朋友说你成熟了，你心里却空落落的。这是成长，还是被换掉了？",
 opts:[{a:"成熟不等于认输，我在工作里守规则，心里还留着那片花果山",b:"悟空型 · 外圆内方",who:"悟空型 · 锐",idx:104,du:"这一棒打死的到底是六耳，还是原来的你？斗战胜佛是被规训成功的标本——你的野性还留几成，只有你自己知道。<span class='s'>此难度与不度，都在你。——见素</span>"},
 {a:"我确实变了，但安稳比锋利重要，这没什么不好",b:"唐僧型 · 随缘安分",who:"唐僧型 · 执",idx:94,du:"你选择了安稳，把锋利的自己收进了盒子里。盒子里没有风浪，也没有花果山——偶尔路过镜子，别忘了看一眼里面是谁。<span class='s'>此难度与不度，都在你。——见素</span>"},
 {a:"说不清哪个是真的我，好像两边都是我",b:"八戒型 · 模棱两可",who:"八戒型 · 滑",idx:98,du:"真我和假我，你早已分不清，也不愿分清。混沌有时是智慧，有时是逃避——但镜子里照出的，始终只有一个人。<span class='s'>此难度与不度，都在你。——见素</span>"}]},
en:{title:"Chapter 58<br>Two Hearts Throw Heaven into Turmoil; One Body Is Hard Put to Cultivate the Void",orig:"A six-eared macaque takes Wukong's form, injures Tang Monk, and steals the luggage. The two Wukongs fight to the Buddha, who exposes the impostor; Wukong kills it. From then on, Wukong no longer fights head-on and never mentions returning home — has he grown, or has he been replaced?",line:"Who died — the impostor, or the original Wukong?",dil:"After years in the corporate machine, the person who used to speak up is gone. Friends call it maturity; you feel an emptiness. Growth, or replacement?",
 opts:[{a:"Maturity is not surrender — I keep the rules at work, and keep my mountain in my heart",b:"Wukong · smooth outside, true inside",who:"Wukong · Sharp",idx:104,du:"What died that day — the impostor, or you? The victorious Buddha is a well-trained specimen. Only you know how much wildness remains.<span class='s'>This trial is yours to take or leave. — JianMirror</span>"},
 {a:"I have changed, and safety matters more than sharpness — that is fine",b:"Tang Monk · serene compliance",who:"Tang Monk · Rigid",idx:94,du:"You chose safety and shelved your sharp self. The box keeps out storms, and also your mountain — pass a mirror once in a while.<span class='s'>This trial is yours to take or leave. — JianMirror</span>"},
 {a:"I cannot tell which is the real me — both sides feel like me",b:"Bajie · neither here nor there",who:"Bajie · Smooth",idx:98,du:"True and false have blurred, and you no longer care to tell. Ambiguity is sometimes wisdom, sometimes escape — but the mirror always shows one person.<span class='s'>This trial is yours to take or leave. — JianMirror</span>"}]}},
{zh:{title:"第十四回 · 心猿归正 六贼无踪<br>（金箍始末）",orig:"观音给悟空戴上金箍，传了唐僧紧箍咒。不听话，就念咒，头疼欲裂。可成佛那日，金箍自己消失了——它从来不是为「修心」，是为「听话」。",line:"你不是自由了箍才掉，是没用了才掉。",dil:"你身上有没有一道「紧箍咒」——房贷、绩效、职级、家人的期待？它护着你安稳，也管着你听话。你怎么看它？",
 opts:[{a:"我接受这道箍：它让我安稳，也让我按规矩做事",b:"唐僧型 · 顺受",who:"唐僧型 · 执",idx:95,du:"箍护你周全，也替你做了决定。安稳是要付代价的，代价是那句「我想」越说越少——但日子，确实好过。<span class='s'>此难度与不度，都在你。——见素</span>"},
 {a:"我会在箍里腾挪：表面听话，心里留一块自己的地",b:"八戒型 · 明哲",who:"八戒型 · 滑",idx:100,du:"你戴着箍，却学会了在箍里打转：领导面前低眉，心里自有山海。这不是滑头，是普通人的生存智慧。<span class='s'>此难度与不度，都在你。——见素</span>"},
 {a:"我在攒本事、攒底气，想有一天把这箍摘了",b:"悟空型 · 破局",who:"悟空型 · 锐",idx:108,du:"你信箍是暂时的。攒的本事、存的底气，都是为了那一天的「摘」——但别忘了，摘箍之前，先看清自己的头在哪。<span class='s'>此难度与不度，都在你。——见素</span>"}]},
en:{title:"Chapter 14 · The Heart-Ape Returns to the Right<br>(the story of the band)",orig:"Guanyin puts a golden band on Wukong's head and teaches Tang Monk the Tightening Spell. Disobey, and the spell brings agonizing pain. Yet on the day he becomes a Buddha, the band falls away on its own — it was never for cultivating the mind, but for obedience.",line:"The band falls not when you are free, but when you are no longer needed.",dil:"Is there a band on your head — mortgage, KPIs, rank, family expectations? It keeps you safe, and it keeps you obedient. How do you see it?",
 opts:[{a:"I accept the band: it keeps me safe and keeps me in line",b:"Tang Monk · acceptance",who:"Tang Monk · Rigid",idx:95,du:"The band protects you and decides for you. Safety has a price: the phrase 'I want' grows quieter — but life, indeed, is easier.<span class='s'>This trial is yours to take or leave. — JianMirror</span>"},
 {a:"I maneuver within the band: obedient outside, my own land inside",b:"Bajie · discretion",who:"Bajie · Smooth",idx:100,du:"You wear the band but learned to spin within it: low head to the boss, mountains in the heart. Not slyness — a commoner's wisdom.<span class='s'>This trial is yours to take or leave. — JianMirror</span>"},
 {a:"I am saving skill and spine, hoping one day to take the band off",b:"Wukong · breaker",who:"Wukong · Sharp",idx:108,du:"You believe the band is temporary. Every skill saved, every spine kept, is for that day of removal — but first, know where your head stands.<span class='s'>This trial is yours to take or leave. — JianMirror</span>"}]}},
{zh:{title:"第四回 · 官封弼马心何足 · 名注齐天意未宁",orig:"悟空上天，被封「弼马温」——听着是「御马监正堂管事」，实则是末等养马小官。他怒反天庭，回花果山，挂起「齐天大圣」的旗。",line:"你愤怒的不是官小，是被当傻子。",dil:"你接到一个 title 很响的 offer，进去才发现活是打杂的，title 只是安抚。你会怎么做？",
 opts:[{a:"掀桌子不干，宁可回「花果山」做自己",b:"悟空型 · 掀桌",who:"悟空型 · 锐",idx:109,du:"你掀了桌子，为自己挂起那面旗。代价是路难走些，好处是抬头时，天还是那片天。<span class='s'>此难度与不度，都在你。——见素</span>"},
 {a:"先干着，title 好用就行，骑驴找马",b:"八戒型 · 骑驴",who:"八戒型 · 滑",idx:97,du:"你把 title 当梯子，把忍耐当本钱。聪明，但也别忘了梯子顶端，还站着谁。<span class='s'>此难度与不度，都在你。——见素</span>"},
 {a:"反思是不是自己心气太高，踏踏实实从头做起",b:"唐僧型 · 守戒",who:"唐僧型 · 执",idx:92,du:"你选择了踏实，把「齐天」藏进「弼马」的皮囊里。稳妥是稳妥，只是那面旗，还挂不挂得起来。<span class='s'>此难度与不度，都在你。——见素</span>"}]},
en:{title:"Chapter 4 · The Title of Horsekeeper Rankles; The Name of Great Sage Leaves No Peace",orig:"Wukong is given the title 'Keeper of the Heavenly Horses' — it sounds grand, but it is the lowest stable job. Furious, he leaves Heaven and raises his own banner: 'Great Sage, Equal of Heaven.'",line:"You rage not at the small post, but at being treated like a fool.",dil:"You take a job with a grand title, then find the work is grunt work — the title was just a placate. What do you do?",
 opts:[{a:"Walk out and go back to my own mountain",b:"Wukong · defiance",who:"Wukong · Sharp",idx:109,du:"You turned the table and raised your own banner. The road is harder; the reward is that when you look up, the sky is still the sky.<span class='s'>This trial is yours to take or leave. — JianMirror</span>"},
 {a:"Keep the job, use the title as a ladder, and look around",b:"Bajie · ladder",who:"Bajie · Smooth",idx:97,du:"You treat the title as a ladder and patience as capital. Clever — but remember who stands at the top of the ladder.<span class='s'>This trial is yours to take or leave. — JianMirror</span>"},
 {a:"Reflect that I may be too proud, and start humbly from the bottom",b:"Tang Monk · discipline",who:"Tang Monk · Rigid",idx:92,du:"You chose steadiness, tucking 'Equal of Heaven' into the stablekeeper's skin. Safe, yes — but can that banner still be raised?<span class='s'>This trial is yours to take or leave. — JianMirror</span>"}]}},
];

// ============ 渲染 ============
function renderMirror(){
  const m=MIRRORS[mi][lang];
  document.getElementById('sub').textContent = (lang==='zh'?'西游镜鉴录 · 第':'Xiyou Mirror Records · Mirror ')+(mi+1)+(lang==='zh'?'镜':'');
  document.getElementById('tOrgTitle').innerHTML=m.title;
  document.getElementById('tOrgP').textContent=m.orig;
  document.getElementById('tOrgQ').textContent=m.line;
  document.getElementById('tDilP').textContent=m.dil;
  for(let i=0;i<3;i++){
    document.getElementById('tOpt'+['A','B','C'][i]).textContent=m.opts[i].a;
    document.getElementById('tOpt'+['A','B','C'][i]+'2').textContent=m.opts[i].b;
  }
}
function enterMirror(){ renderMirror(); show('vOrigin'); }
function nextMirror(){ mi=(mi+1)%MIRRORS.length; renderMirror(); show('vOrigin'); }
function pick(i){
  const o=MIRRORS[mi][lang].opts[i], idx=Math.min(100,Math.max(0,o.idx));
  document.getElementById('tRes1').innerHTML = t('res1')+' <b>'+o.a+'</b>';
  document.getElementById('tRes2').innerHTML = t('res2')+' <b>'+o.who+'</b>';
  document.getElementById('rIdx').textContent=idx;
  document.getElementById('rDuyu').innerHTML=o.du;
  show('vResult');
  setTimeout(()=>{ document.getElementById('rFill').style.width=idx+'%'; document.getElementById('rFillLbl').textContent=idx; },120);
}
function setL(l){
  lang=l;
  document.getElementById('btnZh').className=l==='zh'?'active':'';
  document.getElementById('btnEn').className=l==='en'?'active':'';
  document.getElementById('tSound').textContent=t('sound');
  document.getElementById('tUse').textContent=t('use');
  document.getElementById('tDisc').textContent=t('disc');
  document.getElementById('tAbout').textContent=t('about');
  document.getElementById('slogan').textContent=t('slogan');
  document.getElementById('tHomeTag').textContent=t('homeTag');
  document.getElementById('tHomeP').textContent=t('homeP');
  document.getElementById('tHomeP2').textContent=t('homeP2');
  document.getElementById('tEnter').textContent=t('enter');
  document.getElementById('tOrgTag').textContent=t('orgTag');
  document.getElementById('tNext').textContent=t('next');
  document.getElementById('tDilTag').textContent=t('dilTag');
  document.getElementById('tDilTitle').textContent=t('dilTitle');
  document.getElementById('tResTag').textContent=t('resTag');
  document.getElementById('tIdxLbl').textContent=t('idxLbl');
  document.getElementById('tIdxTip').textContent=t('idxTip');
  document.getElementById('tNextM').textContent=t('nextM');
  renderMirror();
}
function openModal(type){
  const html = type==='use'?t('useHtml') : type==='disc'?t('discHtml') : t('aboutHtml');
  document.getElementById('modalBox').innerHTML = '<button class="modal-close" onclick="closeModal()">✕</button>' + html;
  document.getElementById('modalOverlay').classList.add('show');
}
function closeModal(){ document.getElementById('modalOverlay').classList.remove('show'); }
(function(){ try{applyTheme(localStorage.getItem('jsTheme')||'light');}catch(e){applyTheme('light');} setL('zh'); })();
</script>
</body>
</html>
